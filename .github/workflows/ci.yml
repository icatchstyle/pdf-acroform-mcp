name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  pypdf-floor:
    name: Tests against the oldest supported pypdf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The dependency floor is a promise: pypdf 5 and 6 differ in the raw object
      # model this code walks, so the lower bound gets its own run rather than
      # being asserted in the README.
      - name: Install with pypdf 5.x
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "pypdf>=5.0,<6"

      - name: Show the resolved version
        run: python -c "import pypdf; print('pypdf', pypdf.__version__)"

      - name: Run tests
        run: pytest tests/ -v

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - run: ruff check .
      - run: ruff format --check .

  package:
    name: Package builds and the server imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and install
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl

      # Importing the SERVER module, not just the package: a typo in an @mcp.tool()
      # signature or a breaking change in the MCP SDK only shows up here.
      - name: Import check
        run: |
          cd "$RUNNER_TEMP"
          python -c "import pdf_acroform_mcp as m; print('pdf-acroform-mcp', m.__version__)"
          python -c "import pdf_acroform_mcp.server as s; print('server:', s.mcp.name)"

      - name: Tools are registered
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import asyncio
          import pdf_acroform_mcp.server as s

          names = sorted(t.name for t in asyncio.run(s.mcp.list_tools()))
          expected = ["pdf_check_acroform", "pdf_diff_fields", "pdf_fill", "pdf_inspect_fields"]
          assert names == expected, f"{names} != {expected}"
          print("tools:", names)
          PY
