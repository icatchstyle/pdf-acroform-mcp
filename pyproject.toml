[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-acroform-mcp"
version = "1.0.0"
description = "MCP server for PDF AcroForm work — inspect, fill, diff and check form fields"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["mcp", "pdf", "acroform", "pypdf", "forms", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    # Pinned to the 1.x line: the server is written against the FastMCP API of
    # SDK 1.x, which moved in 2.0.
    "mcp[cli]>=1.0,<2",
    # Both 5.x and 6.x are exercised in CI; 7 is fenced off until it is.
    "pypdf>=5.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/icatchstyle/pdf-acroform-mcp"
Issues = "https://github.com/icatchstyle/pdf-acroform-mcp/issues"
Changelog = "https://github.com/icatchstyle/pdf-acroform-mcp/blob/main/CHANGELOG.md"

[project.scripts]
pdf-acroform-mcp = "pdf_acroform_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["pdf_acroform_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# SIM108 would turn two explicit branches into a nested ternary that then
# breaks the line-length limit. Readability wins.
ignore = ["SIM108"]
